# Paste inside the lrtvs.gy 443 server block (marker: ROCKLAND STREAMER U), next to the CHANNEL 10 LIVE block.
location /university/enrol/submit {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8160/submit;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 8k;
}
location /university/ {
    alias /var/www/lrtvs-home/university/;
    index index.html;
    try_files $uri $uri/ =404;
}
